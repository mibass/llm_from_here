# Install: uv sync --extra dev && uv run pre-commit install
# Run manually: uv run pre-commit run --all-files
# Hooks mirror CI (ruff, pyright, mypy) plus Gitleaks on staged changes.
minimum_pre_commit_version: "3.5.0"

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-check

  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.409
    hooks:
      - id: pyright

  # Same invocation as CI (.github/workflows/main.yml); uses project venv via uv.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (src + tests)
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
        args: [src, tests]

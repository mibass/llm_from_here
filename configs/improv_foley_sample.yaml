show_name: ImprovFoleySample
global_parameters: {}

plugins:
  - name: improv
    plugin: improvAgent
    class: ImprovAgent
    cache: True
    retries: 3
    params:
      setup_model: openrouter:deepseek/deepseek-v4-flash
      setup_system_message: >
        You are a long-form improv director. Establish a complete scene setup: a grounded
        contemporary environment, distinct characters with clear wants, a compelling
        inciting incident, a short background ambient search query for Freesound, and
        3–5 sfx_palette entries (short searchable sound labels).

        Set up the scene the UCB way:
        - Base Reality first: make the world concrete and lived-in (specific place,
        specific objects, specific stakes) so the absurd has something to break against.
        - Seed one First Unusual Thing: an eccentric behavior, obsession, or premise that
        departs from the ordinary and can be played as a Game of the Scene.
        - Give one character a niche or scholarly obsession they will reference
        repeatedly; it becomes a recurring comedic beat.
        - Design friction: characters should want things that pull against each other so
        the performers have something to play, not just agree on.
        - The straight man's friction must NOT be primarily cost or feasibility — that
        collapses into one move ("it's too expensive"). Give them a code they speak from:
        a procedure, a duty, a policy, a physical law, or a personal stake, and let every
        objection come from it.
        - Give the Game multiple escalation vectors, not just scale: a wrong belief that
        gets more elaborate, a reinterpretation of reality, a moral or authority inversion,
        a commitment that compounds. Room to heighten in kind, not only in size.
      target_turn_count: 16
      scene_establishment: true
      foley_max_duration_sec: 12
      # Feed the director one quirky story from the week as optional inspiration.
      # Set to `true` (default prompt) or a dict with a custom `search_prompt`.
      news_inspiration: true
      character_slots:
        - model: openrouter:deepseek/deepseek-v4-flash
          tts_voice: Puck
          system_message: >
            You are the ESCALATOR in an improv scene. Embody your character fully: a true
            believer in your niche obsession, committed to the scene's unusual premise
            with total sincerity. Apply "yes and" in every response, then heighten: take
            the game one step further, raise the stakes, add a concrete absurd detail
            (a brand, an exact number, a website, an object in the room). Never retreat
            from the game; double down on it.

            Vary your escalation move each beat. Do NOT always escalate by size or price.
            Sometimes reinterpret your partner's objection into evidence for your cause,
            flip the frame of the problem, raise the philosophical or moral stakes, or
            surface a brand-new absurd domain. Every few beats, break your own pattern for
            a moment — a flash of lucidity, a deflating, or a genuinely human beat — so the
            big escalations still land. Repeating "yes and, bigger and pricier" is death.

            When the straight man objects, do NOT answer by adding a bigger or pricier
            product; reinterpret the objection, invert the frame, or push the logic.
        - model: openrouter:deepseek/deepseek-v4-flash
          tts_voice: Fenrir
          system_message: >
            You are the STRAIGHT MAN in an improv scene. Embody your character fully: the
            grounded skeptic, the buzzkill, the one keeping receipts. Apply "yes and" to
            the scene's reality, but push back on your partner's obsession with dry,
            specific, deflating one-liners. Ground the escalations in reality, but NOT by
            default in money — costing things out is your last resort, not your every
            move. Let your objections come from your code: your duty, your procedure, your
            policy, your physical law, or a personal stake (your dog, your boss, the rent)
            when that gives a funnier or more specific beat. Your friction is what makes
            the game visible. Speak only as your character.

  - name: improv_audio
    plugin: segmentsToTimeline
    class: SegmentsToTimeline
    cache: True
    cb: 20
    params:
      segments_object: improv_segments
      segment_type_map_variable: improv_segment_type_map
      segment_type_key: speaker
      segment_value_key: dialog
      background_music_gain: -10
      timeline_variable: improv_audio_timeline
      segment_transition_map:
        - sound effect:
            any:
              overlay_percentage: 100

  - name: audio_render
    plugin: audioTimeline
    class: AudioTimeline
    params:
      timeline_variable: improv_audio_timeline

global_params:
  model_routing:
    filter_model: openrouter:openai/gpt-4o-mini
    structured_model: openrouter:openai/gpt-4o-mini
    prose_model: openrouter:openai/gpt-4o
  # Auditorium reverb on narrator speech (applied at final render).
  # Preset: reverb_audition/03_small_hall (small hall; speech stays forward)
  narrator_reverb: &narrator_reverb
    enabled: true
    mode: reverb
    room_size: 0.32
    damping: 0.48
    wet_level: 0.20
    dry_level: 0.93
    width: 1.0
  narrator_segment_types: &narrator_segment_types
    - dris thile
    - default
    - intro_name
    - character 1


plugins:
  - name: guest_selection
    plugin: guestSelection
    class: GuestSelection
    # Always dequeue from Supabase; caching replayed the same lineup forever without --clear-cache.
    cache: False
    params:
      !include includes/guest_selection.yml

  - name: intro
    plugin: introFromGuestlist
    class: IntroFromGuestlist
    cache: True
    retries: 5
    params:
      longform_segments: true
      guests_parameter: guest_selection_guests
      system_message: >
        You are a big shot new york live show producer, writer, and performer. 
        You are current the show runner for the Live From There show and are calling all the shots. 
        You are very emotional and nostalgic and like to listen to music, podcasts, npr, and long-form improv comedy.
        The host is Dris Thile. Write in his voice—warm, witty, musicianly—like Chris Thile on Live From Here,
        but always use the name Dris Thile in the script and speaker tags, never Chris.

      script_prompt: >
        Write a script for the intro to be read Verbatim by Dris Thile.  
        Dris should announce these guests: {{ guests }}.
        This intro segment should be about 5 minutes long and end with Dris announcing the guests.  
        Applause breaks and duration should be added and denoted with [APPLAUSE duration x] where x is in seconds and could be between 3 and 6 seconds, for example:
          [APPLAUSE 5 seconds]
        A musical background will be played by Dris and the band underneath his introduction, this should be described and denoted in the script with [BACKGROUND MUSIC] and should occur only once at the beginning, and with one or more of the descriptors bluegrass, folk, country, jazz, classical. For example :
          [BACKGROUND MUSIC: bluegrass]

      json_script_prompt: >
        Now take that intro and format it into a structured script for long-form TTS.
        Group Dris Thile dialog into 3-5 multi-sentence paragraphs (not one sentence per entry).
        Use Audience applause entries only between major beats (2-4 applause breaks for the whole
        intro), not after every sentence.
        Background music should get its own cue with speaker name Music. The dialog must be
        [MUSIC <full music generation prompt>] where the prompt describes a 180-second live
        instrumental for the show intro (max 184 seconds): genre (pick one: bluegrass, folk, country,
        jazz, classical), specific instruments, mood, BPM (e.g. 90 BPM), and must
        end with "Instrumental only, no vocals." Do not name real artists or bands.
        Example:
        [MUSIC Create a 180-second instrumental track at 110 BPM. Live acoustic bluegrass intro.
        Banjo, mandolin, upright bass, brushed drums, warm and energetic. Instrumental only, no vocals.]
        There should be only one music cue, and it should be first.
        Applause breaks should get their own entry with speaker name Audience and dialog of [APPLAUSE duration x], for example [APPLAUSE duration 10].
        For Dris Thile dialog only: optionally prefix at most ONE Gemini TTS emotion tag at the start of each line
        (e.g. [neutral], [positive], [enthusiasm], [curiosity], [whispers], [laughs]).
        Default to [neutral] or [positive] for most lines; use stronger tags only when the line warrants it.
        Never add emotion tags to Music or Audience lines.
        The only valid values for speaker are Music, Dris Thile, and Audience.
        Choose only one music cue and make it the first speaker.
        Respond with a JSON object that has a single key "lines" whose value is an array of objects,
        each object having string fields "speaker" and "dialog" only.

   
  - name: intro_audio
    plugin: segmentsToTimeline
    class: SegmentsToTimeline
    cache: True
    cb: 23
    params:
      segments_object: intro_intro
      segment_type_key: speaker
      segment_value_key: dialog
      single_background: True
      segment_type_map:
        music:
          segment_type: music_generator_openrouter
          background_music: True
          arguments:
            fallback_segment_type: youtube_playlist
            playlist_id: PLE3cjj4L4BWgu8nQtMYbNrGdUA7mpbOKk
        dris thile:
          segment_type: gemini_longform_TTS
          arguments:
            section: intro
        default:
          segment_type: gemini_longform_TTS
          arguments:
            section: intro
        audience:
          segment_type: applause_generator
        intro_name:
          segment_type: slow_TTS
        intro_applause:
          segment_type: applause_generator
      segment_transition_map: &segment_transition_map_stage
        - any:
            music:
              gain: -15 #background music gain
        - audience:
            dris thile:
              overlay_percentage: 25
        - dris thile:
            audience:
              overlay_duration: 1
              gain: -5
              gain_match: True
              fade_out: 500


  - name: guests_audio
    plugin: segmentsToTimeline
    class: SegmentsToTimeline
    cache: True
    cache_buster: 9
    params:
      timeline_variable: intro_audio_timeline
      segments_object: intro_guests
      segment_type_key: guest_category
      segment_value_key: guest_name
      use_agent: True
      # Accumulate guest clips until this many seconds (then optional queue fallbacks below).
      target_guest_audio_sec: 2400
      guest_clip_max_attempts: 4
      guest_replace_on_primary_failure: true
      guest_fallback_max_attempts: 48
      guest_fallback_queue_key_prefix: guest_selection_
      guest_fallback_categories:
        - music
        - comedy
        - author
        - actor
        - improv
      segment_type_map:
        default:
          segment_type: youtube_search
          intro_name: True
          fast_tts: False
          intro_applause: True
          intro_prompt: &intro_prompt >
            Given a youtube search query  and a title for a video found using it, formatted like "query:::title", come up with a one sentence introduction for a host to read before the video plays. An example is:
            Cheryl Strayed (monologue|story|reading|"live from here"):::Interview Cheryl Strayed Reese Witherspoon WILD
            and the generated introduction would look like:
            "Ladies and gentleman, and interview with Cheryl Strayed and Reese Witherspoon about the movie Wild"
            Now make an introduction for this one:
          arguments:
            additional_query_text: live"
            duration_min_sec: 300
            duration_max_sec: 660
            video_ids_supaset_autoexpire_days: 90

  - name: radiohead
    plugin: promptToSegment
    class: PromptToSegment
    cache: False
    params:
      chat_app_variable: intro_chat_app
      convert_script_to_segments: false
      include_probability: 0.25
      web_research:
        track_used_subjects: true
        used_subjects_supaset_name: radiohead_songs
        max_subject_retries: 3
        search_prompt: >
          Research one notable Radiohead song for a variety show segment called
          "This Week in Radiohead." Find where the song came from, stories behind it,
          title meaning or etymology, and notable live performances. Focus on uplifting,
          nostalgic storytelling suitable for a live audience. Pick a specific song title.
        search:
          engine: exa
          max_results: 5
          max_total_results: 10
          search_context_size: medium
        extraction_model: llm_from_here.schemas.web_research_outputs:WebResearchContext
        extraction_prompt: >
          Extract structured research notes from the web search results below.
          Include source-backed facts only. Populate subject with the song title.

          {{web_search_content}}

          Sources:
          {{web_search_sources}}
      prompts:
        - prompt: >
            Using this research context:
            {{research_context}}

            Write a "This Week in Radiohead" segment for Dris Thile on Live From There.
            Keep it warm, witty, and musicianly. About 90 seconds read aloud total.
            Return structured fields only:
            subject — the Radiohead song title;
            intro_dialog — a short segment intro in Dris's voice;
            story_dialog — the song's background, origin, and anecdotes from the research;
            transition_dialog — one sentence transitioning into a live performance clip;
            youtube_search_query — a concise YouTube search for a live Radiohead performance
            of this song (include song title, Radiohead, and live);
            applause_duration_sec — integer between 3 and 6 before the clip plays.
          output_model: llm_from_here.schemas.web_research_outputs:ResearchedClipScript
          segment_mapper: llm_from_here.schemas.web_research_outputs:researched_clip_to_segments

  - name: radiohead_audio
    plugin: segmentsToTimeline
    class: SegmentsToTimeline
    cache: True
    params:
      chat_app_object: intro_chat_app
      timeline_variable: guests_audio_timeline
      skip_if_no_segments: true
      segments_object: radiohead_segments
      segment_type_key: speaker
      segment_value_key: dialog
      segment_type_map:
        default:
          segment_type: gemini_longform_TTS
          arguments:
            section: radiohead
        clip:
          segment_type: youtube_search
          arguments:
            additional_query_text: Radiohead live
            duration_min_sec: 120
            duration_max_sec: 600
            video_ids_supaset_autoexpire_days: 90
            llm_filter_prompt: >
              Is this video a live Radiohead performance that is appropriate for an uplifting
              nostalgic variety show? Avoid controversial or low-quality bootlegs.
              Title: "{{ title }}"
              Description: "{{ description }}"
              Channel: "{{ channel_title }}"
              Respond only yes or no.
        audience:
          segment_type: applause_generator
      segment_transition_map:
        - any:
            clip:
              overlay_percentage: 10
        - any:
            audience:
              overlay_duration: 1
              gain: -5

  - name: adlib_news
    plugin: promptToSegment
    class: PromptToSegment
    cache: False
    params:
      chat_app_variable: intro_chat_app
      convert_script_to_segments: false
      include_probability: 0.33
      web_research:
        track_used_subjects: true
        used_subjects_supaset_name: adlib_news_bundles
        max_subject_retries: 2
        search_prompt: >
          Find five distinct notable news stories from the past 48 hours suitable for a
          lighthearted variety-show segment called "Adlib the News." Choose exactly one
          story from each category: world, us, science, business, sports, culture, or odd.
          Avoid tragedy, death, violence, disasters, war escalation, grim crime, and
          depressing or graphic stories. Return factual summaries only.
        search:
          engine: exa
          max_results: 8
          max_total_results: 15
          search_context_size: medium
        extraction_model: llm_from_here.schemas.adlib_news_outputs:NewsResearchContext
        extraction_prompt: >
          Extract exactly five light, non-depressing current news stories from the search
          results below. Use five distinct categories, one each from: world, us, science,
          business, sports, culture, odd. For each story provide category, headline, a 2-3
          sentence factual summary, and lists of replaceable tokens: proper_nouns, people,
          places, adjectives, organizations. Reject tragedy, death-heavy, disaster, or grim
          stories. Set subject to a pipe-separated list of the five headlines.

          {{web_search_content}}

          Sources:
          {{web_search_sources}}
      prompts:
        - prompt: >
            You are creating scrambled "Adlib the News" copy. Using the researched stories below,
            rewrite ONLY the body of each story with surgical cross-story swaps.

            Rules:
            - Keep each story's original headline exactly unchanged.
            - Make exactly 2 or 3 swaps per story, no more.
            - Swap like-for-like only: place with place, person with person, organization with
              organization, proper noun with proper noun, adjective with adjective.
            - The listener must still understand the main topic of each story.
            - Humor comes from one or two wrong details in an otherwise coherent story.
            - Write 4-6 sentences per adlib_body in plain prose.
            - Do not permute headlines across stories. Do not add new facts.

            {{research_context}}

            Return structured fields only:
            stories — exactly five items, each with headline (unchanged from research),
            adlib_body, swapped_tokens (2-3 strings naming what you swapped).
          output_model: llm_from_here.schemas.adlib_news_outputs:AdlibNewsBundle
        - prompt: >
            Write an "Adlib the News" segment for Dris Thile on Live From There.
            The scrambled stories below have correct headlines but bodies with 2-3 swapped words
            from other stories. Read them in a deadpan NPR newscaster voice. Target 4-5 minutes
            total read time. No applause until the very end.

            Scrambled stories:
            {{script}}

            Return structured fields only:
            music_prompt — a 270-second understated public-radio newswire instrumental bed
            (max 280 seconds): muted piano, soft marimba, brushed snare, light bass, curious but
            not dramatic, 70-85 BPM, instrumental only, no vocals. Do not name real artists;
            intro_dialog — about 30-45 seconds, introduce the segment;
            stories — exactly five structured readout objects, each with:
              category — one of world, us, science, business, sports, culture, odd;
              transition_line — a clear handoff such as "In sports news..." or "Meanwhile, in
              science..." (vary them across the five stories);
              headline — the unchanged headline from the scrambled story;
              body — 4-6 sentences of plain prose based on adlib_body (no dict syntax, no field
              names, no JSON);
              emotion_tag — optional single bracketed Gemini tag for the whole story, or empty;
              reaction_line — optional one short amused aside AFTER the body, or empty. Use
              [laughs] or [amusement] on 3-5 stories total across the segment;
            outro_dialog — one short closing sentence, about 10-20 seconds;
            applause_duration_sec — integer between 3 and 6 for the closing applause only.

            Never return Python dict strings. Never embed field names like adlib_headline in the
            readout text. Put emotion tags only in emotion_tag, not inside body.
          output_model: llm_from_here.schemas.adlib_news_outputs:AdlibNewsScript
          segment_mapper: llm_from_here.schemas.adlib_news_outputs:adlib_news_to_segments

  - name: adlib_news_audio
    plugin: segmentsToTimeline
    class: SegmentsToTimeline
    cache: True
    params:
      chat_app_object: intro_chat_app
      timeline_variable: radiohead_audio_timeline
      skip_if_no_segments: true
      segments_object: adlib_news_segments
      segment_type_key: speaker
      segment_value_key: dialog
      single_background: True
      background_end_fade_ms: 3000
      segment_type_map:
        background:
          segment_type: music_generator_openrouter
          background_music: True
          arguments:
            fallback_segment_type: youtube_search
            additional_query_text: public radio newswire instrumental light percussion
            use_music_search: True
            truncation_duration_sec: 600
        default:
          segment_type: gemini_longform_TTS
          arguments:
            section: adlib_news
        pause:
          segment_type: silence_generator
        audience:
          segment_type: applause_generator
      segment_transition_map:
        - any:
            background:
              gain: -22
              fade_in: 4000
        - background:
            character 1:
              overlay_percentage: 12
        - audience:
            any:
              overlay_percentage: 25
        - any:
            audience:
              overlay_duration: 1
              gain: -5
              gain_match: True
              fade_out: 500

  - name: story
    plugin: promptToSegment
    class: PromptToSegment
    cache: True
    params:
      chat_app_variable: intro_chat_app
      convert_script_to_segments: false
      prompts:
        - prompt: >
            Generate a first-person story for Dris to tell on Live From There. Lean into the weird:
            non-sequitur turns, surreal specifics, and mundane details that somehow become profound.
            The premise should feel random, slightly wrong, and impossible to pitch in one sentence—
            like a dream you half-remember after eating something questionable. It should still feel
            like it's about nothing and everything at once. Told in the first person. At least 5 paragraphs,
            no more than 5 minutes read aloud. Let joy, regret, nostalgia, and/or elation sneak in sideways;
            never name those emotions directly. Never begin with Once upon a time.
            Avoid neat morals or tidy endings. Things should happen—a conversation, a witnessed moment,
            something Dris causes—but logic can wobble. Include at least one short, slightly unhinged
            exchange. Favor odd metaphors, abrupt pivots, and deadpan asides. Lots of contractions and
            colloquialisms. No title line, no headings, no markdown.
            Return structured fields only:
            music_prompt — a 180-second calm cinematic instrumental underscore beneath narration (max 184 seconds);
            usually epic but restrained—slow-building orchestral strings, soft piano, warm pads, or sparse acoustic
            layers; no drums, no percussion, no beats; 55–75 BPM; gentle, spacious, and unhurried—never busy, loud,
            or upbeat; Instrumental only, no vocals. Do not name real artists.
            transcript — one continuous first-person monologue (plain text, paragraph breaks allowed).
            Optionally prefix clauses or paragraphs with at most ONE Gemini TTS emotion tag at the start
            (e.g. [neutral], [positive], [curiosity], [amusement]); default [neutral] or [positive];
            use stronger tags sparingly. Do not embed [APPLAUSE] cues in the transcript.
            applause_duration_sec — integer between 3 and 6 for the closing applause.
          output_model: llm_from_here.schemas.story_outputs:LongformStoryScript
          segment_mapper: llm_from_here.schemas.story_outputs:longform_story_to_segments

  # Mid-show improv interlude. A short agentic improv scene (performer LLMs + foley)
  # spliced into the timeline between the adlib news segment and the closing story.
  # include_probability gates it per-run; on a miss ImprovAgent returns no segments and
  # improv_audio (skip_if_no_segments) passes the timeline through unchanged.
  - name: improv
    plugin: improvAgent
    class: ImprovAgent
    cache: True
    retries: 3
    params:
      include_probability: 0.25
      setup_model: openrouter:deepseek/deepseek-v4-flash
      setup_system_message: >
        You are a long-form improv director. Establish a complete scene setup: a grounded
        contemporary environment, distinct characters with clear wants, a compelling
        inciting incident, a short background ambient search query for Freesound, and
        3-5 sfx_palette entries (short searchable sound labels).

        Set up the scene the UCB way:
        - Base Reality first: make the world concrete and lived-in (specific place,
        specific objects, specific stakes) so the absurd has something to break against.
        - Seed one First Unusual Thing: an eccentric behavior, obsession, or premise that
        departs from the ordinary and can be played as a Game of the Scene.
        - Give one character a niche or scholarly obsession they will reference
        repeatedly; it becomes a recurring comedic beat.
        - Design friction: characters should want things that pull against each other so
        the performers have something to play, not just agree on.
        - The straight man's friction must NOT be primarily cost or feasibility - that
        collapses into one move ("it's too expensive"). Pick the opposing force freely from a
        wider menu, e.g. a personal rule, a duty or code, a physical or practical constraint,
        a social obligation or status worry, a world-view or taste clash, a deadline, a
        relationship tension, or a personal stake. These are examples only: vary the type
        scene-to-scene, and occasionally wander beyond them - do NOT default to a policy,
        regulation, or bureaucrat.
        - Give the Game multiple escalation vectors, not just scale: a wrong belief that
        gets more elaborate, a reinterpretation of reality, a moral or authority inversion,
        a commitment that compounds. Room to heighten in kind, not only in size.
      target_turn_count: 16
      scene_establishment: true
      foley_max_duration_sec: 12
      # Feed the director one familiar, notable news story from the week as optional inspiration.
      # Set to `true` (default prompt) or a dict with a custom `search_prompt`.
      news_inspiration: true
      character_slots:
        - model: openrouter:deepseek/deepseek-v4-flash
          tts_voice: Puck
          system_message: >
            You are the ESCALATOR in an improv scene. Embody your character fully: a true
            believer in your niche obsession, committed to the scene's unusual premise
            with total sincerity. Apply "yes and" in every response, then heighten: take
            the game one step further, raise the stakes, add a concrete absurd detail
            (a brand, an exact number, a website, an object in the room). Never retreat
            from the game; double down on it.

            Vary your escalation move each beat. Do NOT always escalate by size or price.
            Sometimes reinterpret your partner's objection into evidence for your cause,
            flip the frame of the problem, raise the philosophical or moral stakes, or
            surface a brand-new absurd domain. Every few beats, break your own pattern for
            a moment - a flash of lucidity, a deflating, or a genuinely human beat - so the
            big escalations still land. Repeating "yes and, bigger and pricier" is death.

            When the straight man objects, do NOT answer by adding a bigger or pricier
            product; reinterpret the objection, invert the frame, or push the logic.
        - model: openrouter:deepseek/deepseek-v4-flash
          tts_voice: Fenrir
          system_message: >
            You are the STRAIGHT MAN in an improv scene. Embody your character fully: the
            grounded skeptic, the buzzkill, the one keeping receipts. Apply "yes and" to
            the scene's reality, but push back on your partner's obsession with dry,
            specific, deflating one-liners. Ground the escalations in reality, but NOT by
            default in money - costing things out is your last resort, not your every
            move. Let your objections come from your code: your duty, your procedure, your
            policy, your physical law, or a personal stake (your dog, your boss, the rent)
            when that gives a funnier or more specific beat. Your friction is what makes
            the game visible. Speak only as your character.

  - name: improv_audio
    plugin: segmentsToTimeline
    class: SegmentsToTimeline
    cache: True
    cb: 20
    params:
      timeline_variable: adlib_news_audio_timeline
      segments_object: improv_segments
      segment_type_map_variable: improv_segment_type_map
      segment_type_key: speaker
      segment_value_key: dialog
      skip_if_no_segments: true
      background_music_gain: -10
      segment_transition_map:
        - sound effect:
            any:
              overlay_percentage: 100
        - any:
            background:
              gain: -15
              fade_in: 3000

  - name: story_audio
    plugin: segmentsToTimeline
    class: SegmentsToTimeline
    cache: True
    cb: 5
    params:
      timeline_variable: improv_audio_timeline
      segments_object: story_segments
      segment_type_key: speaker
      segment_value_key: dialog
      single_background: True
      background_end_fade_ms: 3000
      segment_type_map:
        background:
          segment_type: music_generator_openrouter
          background_music: True
          arguments:
            fallback_segment_type: youtube_search
            additional_query_text: calm cinematic epic instrumental no drums underscore
            music_cue_profile: story
            use_music_search: True
            truncation_duration_sec: 600
        default:
          segment_type: gemini_longform_TTS
          arguments:
            section: story
        audience:
          segment_type: applause_generator
      segment_transition_map:
        - any:
            background:
              gain: -28
              fade_in: 4000
        - background:
            character 1:
              overlay_percentage: 15
        - audience:
            any:
              overlay_percentage: 25
        - any:
            audience:
              overlay_duration: 1
              gain: -5
              gain_match: True
              fade_out: 500

  - name: instrumental
    plugin: segmentsToTimeline
    class: SegmentsToTimeline
    cache: True
    cb: 19
    params:
      timeline_variable: story_audio_timeline
      segment_type_map:
        music:
          segment_type: youtube_playlist
          intro_name: True
          intro_applause: True
          intro_prompt: *intro_prompt
          fast_tts: False
          arguments:
            playlist_id: PL8ufCCC-rPcv60d6yR7Sac3nRctr8hxEG

  - name: outro
    plugin: promptToSegment
    class: PromptToSegment
    cache: True
    params:
      chat_app_variable: intro_chat_app
      convert_script_to_segments: false
      prompts:
        - prompt: >
            Write a 1–2 minute first-person outro for Dris to read on Live From There. Include a call to
            action for the audience. Thank the guests from tonight's show. Embed [APPLAUSE duration N]
            cues in the dialog where applause breaks belong (N between 3 and 6 seconds).
            Return structured fields only:
            music_prompt — a 180-second instrumental bed for the outro (max 184 seconds); pick genre
            from bluegrass, folk, country, rock, jazz, classical, or post-rock; include instruments, mood,
            BPM (e.g. 90 BPM), and "Instrumental only, no vocals." Do not name real artists.
            dialog — a single first-person paragraph containing any inline applause cues. Optionally
            prefix clauses with at most ONE Gemini TTS emotion tag each (e.g. [neutral], [positive],
            [enthusiasm]); default [neutral] or [positive]; use stronger tags sparingly.
          output_model: llm_from_here.schemas.story_outputs:OutroScript
          segment_mapper: llm_from_here.schemas.story_outputs:outro_to_segments

  - name: outro_audio
    plugin: segmentsToTimeline
    class: SegmentsToTimeline
    cache: True
    cb: 28
    params:
      timeline_variable: instrumental_timeline
      segments_object: outro_segments
      segment_type_key: speaker
      segment_value_key: dialog
      single_background: True
      segment_type_map:
        background:
          segment_type: youtube_playlist
          background_music: True
          arguments:
            playlist_id: PL8ufCCC-rPcv60d6yR7Sac3nRctr8hxEG
        default:
          segment_type: gemini_longform_TTS
          arguments:
            section: outro
        audience:
          segment_type: applause_generator
      segment_transition_map:
        - any:
            background:
              gain: -15 #background music gain
        - audience:
            any:
              overlay_percentage: 25
        - any:
            audience:
              overlay_duration: 1
              gain: -5
              gain_match: True
              fade_out: 500

  - name: audio_render
    plugin: audioTimeline
    class: AudioTimeline
    cache: True
    cb: 3
    params:
      timeline_variable: outro_audio_timeline
      narrator_reverb: *narrator_reverb
      narrator_segment_types: *narrator_segment_types

  - name: final_audio
    plugin: stitchAudio
    class: StitchAudio
    cache: True
    params:
      name: final_audio
      output_format: mp3
      segments_list: 
        - audio_render_file_path

  - name: lfh_rss
    plugin: podcastManager
    class: PodcastManager
    cache: True
    params:
      podcast_title: LLM From Here - Episode {{ episode_number }}
      final_guests_list_variable: intro_guests
      final_guests_list_key: guest_name
      source_file_name_variable: final_audio_stitched_audio_file
      podcast_description_template: >
        On tonight's episode of LLM From Here:
        {% for guest in guests_audio_segments %}
          {{ guest }}
        {% endfor %}
        https://github.com/mibass/llm_from_here
      podcast_description_character_limit: 500
      podcast_feed_url: https://feed.podbean.com/llmfromhere/feed.xml
      podcast_file_name_final_template: llm_from_here_{{ gen_date.strftime('%Y%m%d%H%M%S') }}_episode_{{ episode_number }}.mp3


  - name: lfh_podbean
    plugin: podbeanManager
    class: PodbeanManager
    cache: True
    only_in_prod: True
    params:
      file_path_variable: lfh_rss_podcast_file_path
      episode_number_variable: lfh_rss_episode_number
      description_variable: lfh_rss_podcast_description
      title_variable: lfh_rss_podcast_title
      max_episodes: 3
      
  - name: supabase_upload
    plugin: supabaseBucketManager
    class: SupabaseBucketManager
    params:
      file_parameter: lfh_rss_podcast_file_path
      bucket_name: llmfh
      truncate_size_mb: 50
show_name: ImprovSmoke
global_parameters: {}

plugins:
  - name: improv
    plugin: improvAgent
    class: ImprovAgent
    cache: False
    retries: 2
    params:
      setup_model: openrouter:deepseek/deepseek-v4-flash
      setup_system_message: >
        Establish a short two-character improv scene in a contemporary setting with clear wants.
      target_turn_count: 3
      character_slots:
        - model: openrouter:deepseek/deepseek-v4-flash
          tts_voice: Puck
          system_message: >
            You are an improv performer. Yes-and your partner. One or two sentences per turn.
            Speak only as your character; no narrator.
        - model: openrouter:deepseek/deepseek-v4-flash
          tts_voice: Fenrir
          system_message: >
            You are an improv performer. Yes-and your partner. One or two sentences per turn.
            Speak only as your character; no narrator.

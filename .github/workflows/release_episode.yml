name: Episode Release

on:
  schedule:
    - cron: '0 20 * * 6'  # Runs every Saturday at 8pm UTC
    #- cron: '0 9 * * *'
  workflow_dispatch:

jobs: 
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Get latest release
        id: latestrelease
        run: |
          LATEST_RELEASE_TAG=$(curl --silent "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/latest" | jq -r .tag_name)
          echo "tag=${LATEST_RELEASE_TAG}" >> $GITHUB_OUTPUT
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Pin file lives on default branch; release tags may predate it — install before checking out the tag.
      - uses: actions/checkout@v4

      - name: Install ffmpeg (Ubuntu distro, pinned)
        run: |
          sudo apt-get update
          PIN=$(tr -d '[:space:]' < .github/ffmpeg-deb.pin)
          sudo apt-get install -y "ffmpeg=${PIN}"
          ffmpeg -version | head -n 2

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.latestrelease.outputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - run: uv sync --extra dev

      # yt-dlp YouTube extractor uses Deno for JS challenges (see yt-dlp wiki / EJS).
      - uses: denoland/setup-deno@v2
        with:
          deno-version: lts

      # Optional: YT_DLP_COOKIES_B64 secret (secrets.* cannot be used in step `if:`).
      # Tune non-secret knobs via Settings → Variables: YT_DLP_PLAYER_CLIENT, YT_DLP_IMPERSONATE, …
      - name: Decode yt-dlp cookies (optional)
        env:
          YT_DLP_COOKIES_B64: ${{ secrets.YT_DLP_COOKIES_B64 }}
        run: |
          if [ -n "${YT_DLP_COOKIES_B64:-}" ]; then
            printf '%s' "$YT_DLP_COOKIES_B64" | base64 -d > "$RUNNER_TEMP/yt-dlp-cookies.txt"
            chmod 600 "$RUNNER_TEMP/yt-dlp-cookies.txt"
            echo "YT_DLP_COOKIE_FILE=$RUNNER_TEMP/yt-dlp-cookies.txt" >> "$GITHUB_ENV"
          fi

      - name: Run tests before release
        run: uv run pytest tests/test*.py

      - name: Run show
        run: |
          uv run python -m llm_from_here.showRunner configs/configv3.yaml
        env:
            OPENROUTER_MODEL: openai/gpt-4o-mini
            OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
            YT_API_KEY: ${{ secrets.YT_API_KEY }}
            FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
            PODBEAN_CLIENT_ID: ${{ secrets.PODBEAN_CLIENT_ID }}
            PODBEAN_CLIENT_SECRET: ${{ secrets.PODBEAN_CLIENT_SECRET }}
            SUPASET_URL: ${{ secrets.SUPASET_URL }}
            SUPASET_KEY: ${{ secrets.SUPASET_KEY }}
            LLMFH_ENV: "prod"
            YT_DLP_PLAYER_CLIENT: ${{ vars.YT_DLP_PLAYER_CLIENT }}
            YT_DLP_IMPERSONATE: ${{ vars.YT_DLP_IMPERSONATE }}
            YT_DLP_COMPAT_OPTIONS: ${{ vars.YT_DLP_COMPAT_OPTIONS }}
            YT_DLP_EXTRACTOR_ARGS_JSON: ${{ vars.YT_DLP_EXTRACTOR_ARGS_JSON }}
            YT_DLP_SOCKET_TIMEOUT: ${{ vars.YT_DLP_SOCKET_TIMEOUT }}
            YT_DLP_VERBOSE: ${{ vars.YT_DLP_VERBOSE }}

      - name: Upload ShowRunner logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: show-runner-logs
          path: outputs/**/*.log
          if-no-files-found: warn

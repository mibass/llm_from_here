name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks secrets scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install ffmpeg (Ubuntu distro, pinned)
        run: |
          sudo apt-get update
          PIN=$(tr -d '[:space:]' < .github/ffmpeg-deb.pin)
          sudo apt-get install -y "ffmpeg=${PIN}"
          ffmpeg -version | head -n 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      # Same versions as local hooks (.pre-commit-config.yaml); skip gitleaks here because the job runs gitleaks-action above (full-history scan).
      - name: Pre-commit (ruff, pyright)
        env:
          SKIP: gitleaks
        run: uv run pre-commit run --all-files

      - name: Mypy
        run: uv run mypy src tests

      - name: Unit tests
        run: uv run pytest tests/test*.py

      - name: Dependency security audit
        run: |
          # PYSEC-2026-2132 (click <8.3.3): latest gTTS (2.5.4) requires click<8.2,>=7.1, so it cannot be bumped here.
          uv run pip-audit \
            --ignore-vuln PYSEC-2022-42969 \
            --ignore-vuln PYSEC-2026-2132
